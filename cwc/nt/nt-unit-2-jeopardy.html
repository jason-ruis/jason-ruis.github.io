<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);

            padding: 20px;
        }

        .container {
            max-width: 1900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;

        .subtitle {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;

        }

        .board {
            display: grid;

            gap: 6px;
            margin-bottom: 30px;
        }

        .category {
            background: #1e3c72;
            color: white;
            padding: 12px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9em;

            border-radius: 5px;
            text-transform: uppercase;

            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-tile {
            background: #1e3c72;

            text-align: center;
            font-size: 1.35em;
            font-weight: bold;
            border: 3px solid #ffd700;
            border-radius: 5px;

            transition: all 0.3s;
        }

        .question-tile:hover:not(.used) {
            background: #2a5298;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .question-tile.used {
            background: #0d1b2a;
            color: #555;
            cursor: not-allowed;
            border-color: #555;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }

        .modal-content {
            background-color: #1e3c72;
            margin: 3% auto;
            padding: 40px;
            border: 5px solid #ffd700;
            border-radius: 10px;
            width: 85%;
            max-width: 900px;
            color: white;
            position: relative;
        }

        .close {
            color: #ffd700;
            float: right;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            line-height: 30px;
        }

        .close:hover {
            color: white;
        }

        .question-text {
            font-size: 1.6em;
            margin: 30px 0;
            text-align: center;
            line-height: 1.5;
        }

        .value {
            color: #ffd700;
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .answer {
            display: none;
            background: #0d1b2a;
            padding: 25px;
            margin-top: 30px;
            border-radius: 5px;
            font-size: 1.2em;
            border: 2px solid #ffd700;
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
        }

        .answer-source {
            display: block;
            margin-top: 16px;
            font-size: 0.75em;
            color: #ffd700;
            opacity: 0.8;
            white-space: normal;
        }

        .category-label {
            color: #ffd700;
            text-align: center;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .show-answer-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            font-size: 1.3em;
            background: #ffd700;
            color: #1e3c72;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .show-answer-btn:hover {
            background: white;
            transform: scale(1.05);
        }

        .reset-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            font-size: 1.2em;
            background: #28a745;
            color: white;
            border: 3px solid white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .score-card {
            background: white;
            padding: 25px 40px;
            border-radius: 10px;
            border: 4px solid #ffd700;
            text-align: center;
            min-width: 200px;
        }

        .score-label {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .blue-label {
            color: #0066cc;
        }

        .gold-label {
            color: #b8860b;
        }

        .score-value {
            font-size: 3em;
            font-weight: bold;
            color: #1e3c72;
        }

        .team-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .team-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
        }

        .blue-btn {
            background: #0066cc;
        }

        .blue-btn:hover {
            background: #0052a3;
            transform: scale(1.05);
        }

        .gold-btn {
            background: #b8860b;
        }

        .gold-btn:hover {
            background: #8f6a09;
            transform: scale(1.05);
        }

        .no-point-btn {
            background: #6c757d;
            padding: 15px 30px;
        }

        .no-point-btn:hover {
            background: #5a6268;
            transform: scale(1.05);
        }

        @media (max-width: 1200px) {
            .board {
                grid-template-columns: repeat(6, 1fr);
            }

            .question-tile {
                font-size: 1.2em;
                padding: 15px 5px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .subtitle {
                font-size: 1.05em;
            }

            .board {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }

            .category {
                font-size: 0.62em;
                padding: 8px 3px;
                min-height: 54px;
            }

            .question-tile {
                font-size: 1em;
                padding: 12px 4px;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .question-text {
                font-size: 1.1em;
            }

            .answer {
                font-size: 1em;
            }

            .team-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UNIT 2 JEOPARDY</h1>
        <div class="subtitle">New Testament: The Synoptic Gospels (Mark, Matthew, Luke)</div>

        <div class="scoreboard">
            <div class="score-card">
                <div class="score-label blue-label">Team Blue</div>
                <div class="score-value" id="blueScore">0</div>
            </div>
            <div class="score-card">
                <div class="score-label gold-label">Team Gold</div>
                <div class="score-value" id="goldScore">0</div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBtn">&times;</span>
            <div class="category-label" id="categoryLabel"></div>
            <div class="value" id="pointValue"></div>
            <div class="question-text" id="questionText"></div>
            <button class="show-answer-btn" id="showAnswerBtn">Show Answer</button>
            <div class="answer" id="answerText"></div>
            <div class="team-buttons" id="teamButtons" style="display: none;">
                <button class="team-btn blue-btn" id="blueBtn">Team Blue Got It Right</button>
                <button class="team-btn gold-btn" id="goldBtn">Team Gold Got It Right</button>
                <button class="team-btn no-point-btn" id="noPointBtn">No Points</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            "Mark's Gospel",
            "Called & Recognized",
            "Who Is This Man?",
            "The Upside-Down Kingdom",
            "Matthew's Gospel",
            "Sermon on the Mount",
            "The Mission & Church Order",
            "Parables",
            "Eschatology",
            "Luke's Gospel",
            "Preparing the Way",
            "Jesus in Luke"
        ];

        const questions = {
            "Mark's Gospel": {
                "100": {
                    "q": "Name one thing about how Mark writes that makes his Gospel feel fast.",
                    "a": "Euthys (\"immediately\") about forty times. Also: shortest Gospel, no birth story or genealogy, few long teaching blocks.",
                    "s": "Slide plan 2.1"
                },
                "200": {
                    "q": "Who was John Mark, and whose preaching is his Gospel built on?",
                    "a": "From a wealthy Jerusalem family; he quit Paul's first missionary journey. His Gospel is built on Peter's preaching.",
                    "s": "Slide plans 2.1, 2.2"
                },
                "300": {
                    "q": "TERM: What are the Synoptic Gospels?",
                    "a": "Matthew, Mark, and Luke. Synoptic means \"seen together.\"",
                    "s": "Slide plan 2.16"
                },
                "400": {
                    "q": "Mark 1:1 calls the book the beginning of the gospel. What does that word mean, and what did it mean before Mark used it?",
                    "a": "Good news: an announcement. Before Mark, euangelion meant a world-changing public announcement, like the birthday of Emperor Augustus.",
                    "s": "Slide plan 2.1"
                },
                "500": {
                    "q": "Two Gospels can describe the same event differently without either one being false. Explain how that works, and give one example from this unit.",
                    "a": "Three men with three audiences will not write identical accounts. Identical accounts would be suspicious.\nExample: Mark says the bleeding woman grew worse under many doctors; Luke, a doctor, says no one could heal her.",
                    "s": "Slide plan 2.5"
                }
            },
            "Called & Recognized": {
                "100": {
                    "q": "TERM: What is a disciple?",
                    "a": "A follower of Jesus: \"Whoever wants to be my disciple must deny themselves and take up their cross and follow me\" (Mark 8:34).",
                    "s": "Slide plan 2.4"
                },
                "200": {
                    "q": "Who were the first disciples Jesus called, and why were those choices unexpected?",
                    "a": "Fishermen from Galilee and Levi the tax collector. Not one scribe, Pharisee, or priest.",
                    "s": "Slide plan 2.2"
                },
                "300": {
                    "q": "Early in Mark, who recognizes Jesus for who he is before any human being does?",
                    "a": "The demons, and Jesus silences them every time.",
                    "s": "Slide plan 2.2"
                },
                "400": {
                    "q": "TERM: What does Messiah / Christ mean?",
                    "a": "The promised king. First-century Jews expected the man who throws Rome out and rules from Jerusalem.",
                    "s": "Slide plans 2.2, 2.3"
                },
                "500": {
                    "q": "Where in the Old Testament does the title Son of Man come from, and what was Jesus claiming by using it?",
                    "a": "Daniel 7. He was claiming to be the one given authority, glory, and an everlasting kingdom, a claim to the throne.",
                    "s": "Slide plan 2.2"
                }
            },
            "Who Is This Man?": {
                "100": {
                    "q": "At Caesarea Philippi, who did people say Jesus was, and what did Peter answer?",
                    "a": "John the Baptist, Elijah, or one of the prophets. Peter: \"You are the Christ.\"",
                    "s": "Slide plan 2.4"
                },
                "200": {
                    "q": "When Jesus looks at the crowd of five thousand, what does Mark say he sees?",
                    "a": "Sheep without a shepherd.",
                    "s": "Slide plan 2.3"
                },
                "300": {
                    "q": "Two Old Testament pictures are behind the feeding of the five thousand. Name them.",
                    "a": "The shepherd (sheep without a shepherd) and the exodus (bread in the wilderness, like manna).",
                    "s": "Slide plan 2.3"
                },
                "400": {
                    "q": "Jesus says \"It is I\" to the disciples on the water. What is he actually saying, and what Old Testament passage is it hinting at?",
                    "a": "\"I AM,\" God's name from the burning bush (Exodus 3:14).",
                    "s": "Slide plan 2.3"
                },
                "500": {
                    "q": "Peter gets the answer right and then gets rebuked. Why?",
                    "a": "He rebuked Jesus for predicting his death. He said the right word but meant the wrong thing: a crown without a cross.",
                    "s": "Slide plan 2.4"
                }
            },
            "The Upside-Down Kingdom": {
                "100": {
                    "q": "TERM: What is the kingdom of heaven?",
                    "a": "God's rule arriving on earth, with Jesus. It is Matthew's phrase for the kingdom of God.",
                    "s": "Slide plans 2.9, 2.11"
                },
                "200": {
                    "q": "How did Jesus reverse the order of greatness for his disciples?",
                    "a": "\"Anyone who wants to be first must be the very last, and the servant of all\" (Mark 9:35).",
                    "s": "Slide plan 2.4"
                },
                "300": {
                    "q": "What does Jesus mean by becoming like a little child in Matthew 18?",
                    "a": "Taking the lowly position. A child had no legal standing and no status.",
                    "s": "Slide plan 2.11"
                },
                "400": {
                    "q": "What kind of person does Jesus call blessed? Give all of the examples.",
                    "a": "The poor in spirit, those who mourn, the meek, those who hunger and thirst for righteousness, the merciful, the pure in heart, the peacemakers, and those persecuted because of righteousness.",
                    "s": "Slide plan 2.8"
                },
                "500": {
                    "q": "Trace the reversal pattern through this unit. Where does Jesus turn the expected order upside down? Give three places and say what gets reversed in each.",
                    "a": "Any three:\n- Mark 10: the first will be last\n- The Beatitudes: the poor and the meek are blessed\n- Mary's song: rulers brought down, the humble lifted up\n- Luke 18: the tax collector goes home justified, not the Pharisee",
                    "s": "Slide plans 2.4, 2.8, 2.13, 2.16"
                }
            },
            "Matthew's Gospel": {
                "100": {
                    "q": "TERM: What is a genealogy?",
                    "a": "A family tree. Matthew's runs back to Abraham; Luke's runs back to Adam.",
                    "s": "Slide plans 2.6, 2.14"
                },
                "200": {
                    "q": "Matthew opens with Abraham and David. Why those two names?",
                    "a": "Two promises: blessing to all nations through Abraham, and a forever throne for David.",
                    "s": "Slide plan 2.6"
                },
                "300": {
                    "q": "Who was Matthew writing for, and how can you tell from the way he writes?",
                    "a": "Jews. He uses Old Testament fulfillment quotes (\"so was fulfilled\"), about sixty-five times.",
                    "s": "Slide plans 2.5, 2.6"
                },
                "400": {
                    "q": "Four women are named in the genealogy. Who are they, and why would Matthew include them?",
                    "a": "Tamar, Rahab, Ruth, and the wife of Uriah. God's promise never depended on the family being clean.",
                    "s": "Slide plan 2.6"
                },
                "500": {
                    "q": "Three men wrote three books about the same Jesus. For Matthew, Mark, and Luke, give the audience each one wrote for and one feature of the book that shows it.",
                    "a": "Matthew: Jews. Fulfillment quotes.\nMark: Romans. Speed and blunt detail.\nLuke: Gentiles. Careful dating and outsiders at the center.",
                    "s": "Slide plan 2.5"
                }
            },
            "Sermon on the Mount": {
                "100": {
                    "q": "TERM: What are the Beatitudes?",
                    "a": "The \"Blessed are...\" sayings that open the Sermon on the Mount (Matthew 5:3-12). Blessed is a verdict, not a wish.",
                    "s": "Slide plan 2.8"
                },
                "200": {
                    "q": "Define hyperbole and give one example of Jesus using it in Matthew 5-7.",
                    "a": "Deliberate exaggeration used to make a point stick. Example: \"If your right eye causes you to sin, gouge it out\" (5:29).",
                    "s": "Slide plan 2.7"
                },
                "300": {
                    "q": "Jesus says he came to fulfill the Law and the Prophets, not abolish them. What does fulfill mean here?",
                    "a": "To bring to completion. He is the thing the law was pointing at.",
                    "s": "Slide plan 2.7"
                },
                "400": {
                    "q": "When Jesus says \"But I tell you,\" is he making the command harder than it was? Explain.",
                    "a": "No. He shows what it always meant. Outward action becomes inward condition.",
                    "s": "Slide plan 2.7"
                },
                "500": {
                    "q": "Why is the parable of the two builders the right way to end this sermon?",
                    "a": "Both builders heard and the same storm hit both. The rock is hearing plus doing.",
                    "s": "Slide plan 2.7"
                }
            },
            "The Mission & Church Order": {
                "100": {
                    "q": "In Matthew 10, who does Jesus send, and where does he send them first?",
                    "a": "The twelve, to the lost sheep of Israel. First, not only.",
                    "s": "Slide plan 2.9"
                },
                "200": {
                    "q": "What opposition does Jesus tell them to expect?",
                    "a": "Sheep among wolves: handed over, flogged, brought before governors, betrayed. The student is not above the teacher.",
                    "s": "Slide plan 2.9"
                },
                "300": {
                    "q": "Give two reasons Jesus gives them not to be afraid.",
                    "a": "Any two: nothing hidden will stay hidden; they cannot kill the soul; you are worth more than many sparrows.",
                    "s": "Slide plan 2.9"
                },
                "400": {
                    "q": "List the steps Jesus gives for confronting a believer who sins against you.",
                    "a": "1. Just between the two of you\n2. One or two others along\n3. Tell it to the church\n4. Treat them as a pagan or tax collector",
                    "s": "Slide plan 2.11"
                },
                "500": {
                    "q": "Peter asks whether seven times is enough. What does Jesus answer, and what does the unmerciful servant show about why?",
                    "a": "Seventy-seven times, which means stop counting. Forgiven people forgive.",
                    "s": "Slide plan 2.11"
                }
            },
            "Parables": {
                "100": {
                    "q": "What is a parable, and how is it different from an allegory?",
                    "a": "Parable: a story from ordinary life set beside the kingdom of God.\nAllegory: every detail stands for something else.",
                    "s": "Slide plans 2.10, 2.16"
                },
                "200": {
                    "q": "In the parable of the sower, what are the four soils, and what does Jesus say each one is?",
                    "a": "Path: snatched away\nRocky: joy, no root, falls away\nThorns: choked by worry and wealth\nGood soil: hears, understands, produces",
                    "s": "Slide plan 2.10"
                },
                "300": {
                    "q": "Name two of the short parables in Matthew 13 and say what each one teaches about the kingdom.",
                    "a": "Mustard seed and yeast: it starts small and fills everything.\nTreasure and pearl: it is worth everything.",
                    "s": "Slide plan 2.10"
                },
                "400": {
                    "q": "According to Matthew 13:10-17, why does Jesus teach in parables?",
                    "a": "The secrets of the kingdom are given to the disciples, not the crowds. \"Though seeing, they do not see\" (Isaiah 6).",
                    "s": "Slide plan 2.10"
                },
                "500": {
                    "q": "In the parable of the good Samaritan, who turns out to be the neighbor? Why is that significant?",
                    "a": "The Samaritan, a man Jews despised. Being a neighbor is something you do, not a category.",
                    "s": "Slide plan 2.16"
                }
            },
            "Eschatology": {
                "100": {
                    "q": "Define eschatology.",
                    "a": "The study of last things.",
                    "s": "Slide plan 2.12"
                },
                "200": {
                    "q": "TERM: What does already / not yet mean?",
                    "a": "The kingdom arrived with Jesus' first coming. It will be complete at his second coming.",
                    "s": "Slide plans 2.12, 2.16"
                },
                "300": {
                    "q": "Why does Jesus tell his followers to be ready rather than to calculate the date?",
                    "a": "No one knows the day or hour but the Father. Readiness, not calculation.",
                    "s": "Slide plan 2.12"
                },
                "400": {
                    "q": "What do the parables of Matthew 25 say Jesus' servants should be doing while they wait?",
                    "a": "Keep watch and work faithfully. Waiting is working.",
                    "s": "Slide plan 2.12"
                },
                "500": {
                    "q": "In Matthew 24:3 the disciples ask about two things. What are they, and how was the first one fulfilled?",
                    "a": "When the temple will be destroyed, and the sign of his coming. The Romans destroyed the temple in A.D. 70.",
                    "s": "Slide plan 2.12"
                }
            },
            "Luke's Gospel": {
                "100": {
                    "q": "Who was Luke, and who did he write to?",
                    "a": "A Gentile doctor and companion of Paul. He wrote to Theophilus.",
                    "s": "Slide plan 2.13"
                },
                "200": {
                    "q": "TERM: Who was Theophilus?",
                    "a": "The man Luke wrote to. His name means \"friend of God,\" and he was possibly Luke's patron.",
                    "s": "Slide plan 2.13"
                },
                "300": {
                    "q": "How does Luke say he did his research?",
                    "a": "Eyewitness sources, careful investigation, and an orderly account.",
                    "s": "Slide plan 2.13"
                },
                "400": {
                    "q": "Zechariah and Mary both get news from Gabriel. How does each one answer, and how does God respond to each?",
                    "a": "Zechariah asks for proof and is made silent. Mary asks how, not whether: \"I am the Lord's servant.\"",
                    "s": "Slide plan 2.13"
                },
                "500": {
                    "q": "Mary's song and Zechariah's song both name Old Testament promises. Which two names come up, and what do the songs say God is doing?",
                    "a": "Abraham and David. God is keeping his promises, so certain they sing it as done.",
                    "s": "Slide plan 2.13"
                }
            },
            "Preparing the Way": {
                "100": {
                    "q": "TERM: What is a forerunner?",
                    "a": "The one sent ahead to prepare the way: John the Baptist.",
                    "s": "Slide plan 2.16"
                },
                "200": {
                    "q": "TERM: What is repentance?",
                    "a": "What John preached. It shows in fruit, a changed life, not in your family tree.",
                    "s": "Slide plan 2.14"
                },
                "300": {
                    "q": "What was John the Baptist preaching?",
                    "a": "\"Produce fruit in keeping with repentance.\" Having Abraham as your father is not enough.",
                    "s": "Slide plan 2.14"
                },
                "400": {
                    "q": "What prophet does Luke quote to explain who John is?",
                    "a": "Isaiah: \"A voice of one calling in the wilderness, 'Prepare the way for the Lord.'\"",
                    "s": "Slide plan 2.14"
                },
                "500": {
                    "q": "Luke traces the genealogy back to Adam. Matthew stopped at Abraham. Why the difference?",
                    "a": "Abraham is the father of Israel; Adam is the father of everyone. Luke's is a gospel for everyone.",
                    "s": "Slide plan 2.14"
                }
            },
            "Jesus in Luke": {
                "100": {
                    "q": "Jesus answers all three temptations out of one Old Testament book. Which one, and why does that matter?",
                    "a": "Deuteronomy, the book Israel failed with in the wilderness. Jesus passes where Israel failed.",
                    "s": "Slide plan 2.14"
                },
                "200": {
                    "q": "Name two people in Luke 7-9 who accepted Jesus and one who rejected him.",
                    "a": "Accepted: the centurion and the sinful woman. Rejected: Simon the Pharisee.",
                    "s": "Slide plan 2.16"
                },
                "300": {
                    "q": "What kind of people did Luke go out of his way to show Jesus with?",
                    "a": "Outsiders: Samaritans, tax collectors, women, and the poor.",
                    "s": "Slide plans 2.13, 2.16"
                },
                "400": {
                    "q": "What does Jesus teach about prayer in the parable of the persistent widow?",
                    "a": "Keep praying. God is not the unjust judge. Persistence is the shape faith takes while it waits.",
                    "s": "Slide plan 2.16"
                },
                "500": {
                    "q": "Both Jesus and Satan quote Scripture in Luke 4. Satan's quote is accurate. What makes it a misuse anyway?",
                    "a": "He ignores the context. Psalm 91 is about trusting God; Satan turns it into a dare.",
                    "s": "Slide plan 2.14"
                }
            }
        };

        let usedQuestions = new Set();
        let blueScore = 0;
        let goldScore = 0;
        let currentQuestionValue = 0;

        function updateScoreboard() {
            document.getElementById('blueScore').textContent = blueScore;
            document.getElementById('goldScore').textContent = goldScore;
        }

        function addPointsToBlue() {
            blueScore += currentQuestionValue;
            updateScoreboard();
            closeModal();
        }

        function addPointsToGold() {
            goldScore += currentQuestionValue;
            updateScoreboard();
            closeModal();
        }

        function noPoints() {
            closeModal();
        }

        function initializeBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            categories.forEach((category) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.textContent = category;
                board.appendChild(categoryDiv);
            });

            const values = [100, 200, 300, 400, 500];
            values.forEach((value) => {
                categories.forEach((category) => {
                    const tile = document.createElement('div');
                    tile.className = 'question-tile';
                    tile.textContent = '$' + value;
                    tile.dataset.category = category;
                    tile.dataset.value = value;

                    const questionId = `${category}-${value}`;
                    if (usedQuestions.has(questionId)) {
                        tile.classList.add('used');
                    } else {
                        tile.onclick = () => openQuestion(category, value);
                    }

                    board.appendChild(tile);
                });
            });
        }

        function openQuestion(category, value) {
            const questionId = `${category}-${value}`;
            if (usedQuestions.has(questionId)) return;

            const question = questions[category][value];
            currentQuestionValue = value;

            document.getElementById('pointValue').textContent = '$' + value;
            document.getElementById('questionText').textContent = question.q;
            const answerEl = document.getElementById('answerText');
            answerEl.textContent = question.a;
            const sourceEl = document.createElement('span');
            sourceEl.className = 'answer-source';
            sourceEl.textContent = 'Source: ' + question.s;
            answerEl.appendChild(sourceEl);
            document.getElementById('categoryLabel').textContent = category;
            document.getElementById('answerText').style.display = 'none';
            document.getElementById('teamButtons').style.display = 'none';

            document.getElementById('modal').style.display = 'block';

            usedQuestions.add(questionId);
            initializeBoard();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showAnswer() {
            document.getElementById('answerText').style.display = 'block';
            document.getElementById('teamButtons').style.display = 'flex';
        }

        function resetGame() {
            if (confirm('Are you sure you want to reset the game? All progress and scores will be lost.')) {
                usedQuestions.clear();
                blueScore = 0;
                goldScore = 0;
                updateScoreboard();
                initializeBoard();
                closeModal();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('closeBtn').addEventListener('click', closeModal);
            document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
            document.getElementById('blueBtn').addEventListener('click', addPointsToBlue);
            document.getElementById('goldBtn').addEventListener('click', addPointsToGold);
            document.getElementById('noPointBtn').addEventListener('click', noPoints);

            window.onclick = function(event) {
                const modal = document.getElementById('modal');
                if (event.target === modal) {
                    closeModal();
                }
            };

            initializeBoard();
            updateScoreboard();
        });
    </script>
</body>
</html>
